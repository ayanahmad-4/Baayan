[project]
name = "bayaan"
version = "1.0.0"
description = "Bayaan — Personal AI assistant for Syed Ayan Ahmad"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "groq>=1.7.0",
    "pydantic>=2.10.0",
    "pypdf>=6.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.34.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["back-end"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
